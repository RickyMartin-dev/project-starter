name: Project upgrade suggestions

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-upgrade-review
  cancel-in-progress: true

jobs:
  suggestions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish evidence-backed suggestions
        run: |
          suggestions="$(./scripts/project suggest-upgrades)"
          printf '%s\n' "$suggestions"
          {
            printf '## Project improvement suggestions\n\n'
            printf '```text\n%s\n```\n' "$suggestions"
          } >> "$GITHUB_STEP_SUMMARY"
