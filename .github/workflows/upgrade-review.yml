name: Project upgrade suggestions

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-upgrade-review
  cancel-in-progress: true

jobs:
  suggestions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Print deterministic upgrade suggestions
        run: ./scripts/project suggest-upgrades --json
